<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cookies Moove GDPR Cookie Compliance (fixture)</title><script>window.clicked=[];const hit=k=>{window.clicked.push(k);window.accepted=k};</script>
<style>#moove_gdpr_cookie_info_bar{position:fixed;bottom:0;left:0;right:0;background:#202020;color:#fff;padding:12px}</style></head><body>
<main><h1>Blog</h1></main>
<aside id="moove_gdpr_cookie_info_bar" class="moove-gdpr-align-center moove-gdpr-dark-scheme gdpr_infobar_postion_bottom" aria-label="Banner de cookies" style="display:block">
<div class="moove-gdpr-info-bar-container"><div class="moove-gdpr-info-bar-content"><div class="moove-gdpr-cookie-notice"><p>Usamos cookies para oferecer a melhor experiência.</p></div>
<div class="moove-gdpr-button-holder"><button class="mgbutton moove-gdpr-infobar-reject-btn gdpr-fbo-1" aria-label="Rejeitar" onclick="hit('rejeitar')">Rejeitar</button>
<button class="mgbutton moove-gdpr-infobar-allow-all gdpr-fbo-0" aria-label="Aceitar" role="button" onclick="hit('moove')">Aceitar</button>
<button class="mgbutton moove-gdpr-infobar-settings-btn change-settings-button gdpr-fbo-2" aria-label="Configurações" onclick="hit('ajustes')">Configurações</button></div></div></div></aside>
</body></html>

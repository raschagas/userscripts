<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cookies Cookie Notice WordPress (fixture)</title><script>window.clicked=[];const hit=k=>{window.clicked.push(k);window.accepted=k};</script>
<style>#cookie-notice{position:fixed;bottom:0;left:0;right:0;background:#32323a;color:#fff;padding:12px}</style></head><body>
<main><h1>Blog</h1></main>
<div id="cookie-notice" role="dialog" class="cookie-revoke-hidden cn-position-bottom" aria-label="Cookie Notice"><div class="cookie-notice-container">
<span id="cn-notice-text" class="cn-text-container">Usamos cookies para garantir a melhor experiência.</span>
<span id="cn-notice-buttons" class="cn-buttons-container"><button id="cn-accept-cookie" data-cookie-set="accept" class="cn-set-cookie cn-button" aria-label="Ok" onclick="hit('cn')">Ok</button>
<button id="cn-refuse-cookie" data-cookie-set="refuse" class="cn-set-cookie cn-button" aria-label="Não" onclick="hit('recusar')">Não</button></span>
<button type="button" id="cn-close-notice" data-cookie-set="accept" class="cn-close-icon" aria-label="Não" onclick="hit('fechar')">×</button></div></div>
</body></html>

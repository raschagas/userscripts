<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cookies Google Funding Choices (fixture)</title><script>window.clicked=[];const hit=k=>{window.clicked.push(k);window.accepted=k};</script>
<style>.fc-consent-root{position:fixed;inset:0;background:rgba(0,0,0,.4)}.fc-dialog-container{background:#fff;margin:80px auto;width:600px;padding:16px}</style></head><body>
<main><h1>Dicionário</h1><p>Conteúdo.</p></main>
<div class="fc-consent-root"><div class="fc-dialog-container"><div class="fc-dialog fc-choice-dialog" role="dialog" aria-modal="true">
<h1 class="fc-dialog-headline">O site exemplo pede consentimento para usar os seus dados</h1>
<p>Dados pessoais, como identificadores de dispositivo, podem ser tratados para anúncios.</p>
<button class="fc-faq-header fc-dialog-restricted-content" onclick="hit('saber-mais')">Saber mais</button>
<div class="fc-footer-buttons"><button class="fc-button fc-cta-do-not-consent fc-secondary-button" onclick="hit('nao-consentir')">Não consentir</button>
<button class="fc-button fc-cta-consent fc-primary-button" onclick="hit('fc');document.querySelector('.fc-consent-root').remove()">Consentir</button>
<button class="fc-button fc-cta-manage-options fc-secondary-button" onclick="hit('gerir')">Gerir opções</button></div></div></div></div>
</body></html>

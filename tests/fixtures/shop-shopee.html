<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Shopee Brasil busca (fixture)</title>
<!-- Estrutura copiada do esqueleto real da busca logada (2026-11-11), com dados neutros:
     li.shopee-search-item-result__item > div[role=group] > .shopee_ic > div[role=group] > a.contents > ... >
     div.w-full.relative.z-0 > picture (display:contents) > img absoluto (a foto). O <picture> não tem caixa:
     getBoundingClientRect() dá zeros, e ancorar nele punha o círculo fora da foto. No título, outro <picture>
     com o selo "flag-label"; nota em span ao lado de img alt="rating-star"; "N Vendido(s)". Os últimos li ainda
     não carregaram (vazios), como no esqueleto. O rótulo "Ad" não apareceu no esqueleto: o card "ad" é suposição. -->
<style>*{box-sizing:border-box}body{margin:0;padding-bottom:1200px;font:13px system-ui;background:#f5f5f5}
.shopee-search-item-result__items{display:grid;grid-template-columns:repeat(5,190px);gap:10px;list-style:none;margin:0;padding:10px}
.shopee-search-item-result__item{background:#fff;min-height:300px}a.contents{display:contents;color:#222;text-decoration:none}
._displayContents_x1{display:contents}.flex{display:flex}.flex-col{flex-direction:column}
.w-full.relative{position:relative;width:100%;aspect-ratio:1}img.foto{position:absolute;inset:0;width:100%;height:100%;background:#ccc}
.p-2{padding:8px}.flag{display:inline-block;width:29px;height:14px;background:#ee4d2d}.star{width:13px;height:13px;background:#fc0}
.loc{width:10px;height:13px;background:#999}</style></head><body>
<ul class="row shopee-search-item-result__items" id="g"></ul>
<script>
const GIF='data:image/gif;base64,R0lGODlhAQABAAAAACw=';
// [id, nota, vendidos, anúncio, selo no título]
const D=[['ok','5.0','9mil+ Vendido(s)',false,true],['ruim','4.2','2mil+ Vendido(s)',false,false],['poucas','4.9','30 Vendido(s)',false,true],
['ad','4.0','500 Vendido(s)',true,false],['ok2','4.8','1,2mil Vendido(s)',false,false],['nada',null,null,false,false],['ok3','4.7','300 Vendido(s)',false,true]];
const card=([id,r,n,ad,selo],k)=>`<li class="col-xs-2-4 shopee-search-item-result__item" data-sqe="item" data-i="${id}"><div role="group" aria-label="Product card: Produto ${id}">
<div class="shopee_ic"><div class="h-full" role="group" aria-label="Product card"><a class="contents" href="/Produto-${id}-i.12345${k}.67890${k}"><div class="flex flex-col">
<div class="w-full relative z-0"><picture class="_displayContents_x1"><source type="image/webp" class="_displayContents_x1"><img class="foto" alt="Produto ${id}" src="${GIF}"></picture>
<div class="absolute bottom-0 right-0" aria-hidden="true"><div data-testid="badge-video"></div></div></div>
<div class="p-2"><div class="line-clamp-2">${selo?`<picture class="_displayContents_x1"><img class="flag" alt="flag-label" src="${GIF}"></picture>`:''}Produto ${id}</div>
<div class="flex"><span>R$</span><span>29,90</span></div>${ad?'<div>Ad</div>':''}
<div class="flex"><div class="flex">${r?`<div class="flex"><img class="star" alt="rating-star" src="${GIF}"><span>${r}</span></div><div></div>`:''}${n?`<div>${n}</div>`:''}</div></div>
<div><img class="loc" alt="location-icon" src="${GIF}"><span>São Paulo</span></div></div>
</div></a><a href="/find_similar_products?catid=1&amp;itemid=${k}&amp;shopid=1">Similares</a></div></div></div></li>`;
document.getElementById('g').innerHTML=D.map(card).join('')+'<li class="col-xs-2-4 shopee-search-item-result__item" data-sqe="item"></li>'.repeat(3);
window.fill=()=>{const e=document.querySelector('li.shopee-search-item-result__item:empty');e.outerHTML=card(['tarde','3.5','800 Vendido(s)',false,false],9);};
</script></body></html>

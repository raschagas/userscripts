<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cookies Sourcepoint, mensagem no iframe (fixture)</title><script>window.clicked=[];const hit=k=>{window.clicked.push(k);window.accepted=k};</script>
</head><body>
<div id="notice" class="message-container" role="dialog" aria-modal="true"><div class="message type-modal">
<p>Usamos tecnologias de rastreamento. Você pode aceitar ou assinar.</p>
<button class="message-stacksclose" onclick="hit('fechar')">X</button>
<button class="message-component message-button no-children focusable primary-button sp_choice_type_11" onclick="hit('sp')">Aceitar e continuar</button>
<button class="message-component message-button no-children focusable primary-button sp_choice_type_9" onclick="hit('assinar')">Assine agora</button>
<button class="message-component message-button no-children focusable btn-tertiary sp_choice_type_13" onclick="hit('rejeitar')">Rejeitar</button>
<button class="message-component message-button no-children focusable secondary-button sp_choice_type_12" onclick="hit('preferencias')">Preferências</button></div></div>
</body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cookies CookieHub (fixture)</title><script>window.clicked=[];const hit=k=>{window.clicked.push(k);window.accepted=k};</script>
<style>#ch2-dialog{position:fixed;top:30%;left:50%;transform:translateX(-50%);width:480px;background:#fff;border:1px solid #ccc;padding:12px}</style></head><body>
<main><h1>Produto</h1></main>
<div class="ch2 ch2-region-g0"><div class="ch2-container ch2-theme-default ch2-style-light"><div id="ch2-dialog" class="ch2-dialog ch2-dialog-center ch2-visible" role="dialog">
<p>Usamos cookies para personalizar conteúdo.</p><div class="ch2-dialog-actions">
<button class="ch2-btn ch2-deny-all-btn ch2-btn-primary" onclick="hit('negar')">Negar</button>
<button class="ch2-btn ch2-allow-all-btn ch2-btn-primary" onclick="hit('ch')">Permitir todos os cookies</button>
<button class="ch2-btn ch2-open-settings-btn ch2-btn-transparent" onclick="hit('ajustes')">Ajustes de cookies</button></div></div></div></div>
</body></html>
